function entries(teams){return teams.flatMap(t=>state[t].map((p,i)=>({team:t,index:i,x:p.x,y:p.y})))}
function groupEntries(){return entries(target==='both'?['home','away']:[target])}
function move(a,dx,dy){dx=clamp(dx,34-Math.min(...a.map(p=>p.x)),326-Math.max(...a.map(p=>p.x)));dy=clamp(dy,34-Math.min(...a.map(p=>p.y)),506-Math.max(...a.map(p=>p.y)));for(const p of a){const token=p.team==='ball'?state.ball:state[p.team][p.index];token.x=p.x+dx;token.y=p.y+dy}positions()}
function select(key){selected=key;for(const[k,n]of nodes)n.classList.toggle('selected',k===key)}
$('pitch').addEventListener('pointerdown',e=>{if(drag||!e.isPrimary||e.button!==0)return;const n=e.target.closest('.token');if(!group&&!n)return;const p=point(e);if(!p)return;let a;if(n?.id==='ball'){a=ballEntries();select('ball')}else if(group){a=groupEntries();select(null)}else{const t=n.dataset.team,i=Number(n.dataset.index),v=state[t][i];a=[{team:t,index:i,x:v.x,y:v.y}];select(t+':'+i)}e.preventDefault();$('pitch').focus({preventScroll:true});$('pitch').setPointerCapture(e.pointerId);drag={id:e.pointerId,x:p.x,y:p.y,entries:a}});
$('pitch').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=point(e);if(p){e.preventDefault();move(drag.entries,p.x-drag.x,p.y-drag.y)}});
function finish(e){if(!drag||e.pointerId!==drag.id)return;const id=drag.id;drag=null;if($('pitch').hasPointerCapture(id))$('pitch').releasePointerCapture(id);save()}
for(const name of ['pointerup','pointercancel','lostpointercapture'])$('pitch').addEventListener(name,finish);
$('pitch').addEventListener('keydown',e=>{const steps={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!steps[e.key]||(!group&&!selected))return;e.preventDefault();let a;if(selected==='ball')a=ballEntries();else if(group)a=groupEntries();else{const[t,i]=selected.split(':'),p=state[t][i];a=[{team:t,index:Number(i),x:p.x,y:p.y}]}const step=e.shiftKey?10:3,[dx,dy]=steps[e.key];move(a,(landscape?dy:dx)*step,(landscape?-dx:dy)*step);save()});
for(const team of ['home','away']){for(const name of Object.keys(FORMATIONS)){const o=document.createElement('option');o.value=o.textContent=name;$(team+'Formation').append(o)}$(team+'Formation').addEventListener('change',e=>{state[team+'Formation']=e.target.value;resetTeam(team);render();say('フォーメーションを再配置しました。');save()})}
$('flip').onclick=()=>{state.flipped=!state.flipped;for(const t of ['home','away'])for(const p of state[t]){p.x=360-p.x;p.y=540-p.y}state.ball.x=360-state.ball.x;state.ball.y=540-state.ball.y;render();say('選手とボールを点対称に反転しました。');save()};
$('reset').onclick=()=>{resetTeam('home');resetTeam('away');state.ball={x:180,y:270};render();say('現在の選手・フォーメーション・攻撃方向でリセットしました。');save()};
$('centerBall').onclick=()=>{state.ball={x:180,y:270};positions();say('ボールを中央へ戻しました。');save()};
$('groupToggle').onclick=()=>{group=!group;select(null);$('groupToggle').setAttribute('aria-pressed',String(group));$('groupToggle').textContent='全体移動 '+(group?'ON':'OFF');$('groupOptions').hidden=!group;say(group?'移動するチームを選び、ピッチをドラッグしてください。':'個別移動に切り替えました。')};
document.querySelectorAll('[name=target]').forEach(r=>r.onchange=()=>target=r.value);
function count(){$('count').textContent=draft.size+' / 11人';$('apply').disabled=draft.size!==11;$('roster').querySelectorAll('input').forEach(c=>c.disabled=draft.size>=11&&!c.checked)}
$('choose').onclick=()=>{draft=new Set(state.lineup);$('roster').replaceChildren();for(const p of ARSENAL_PLAYERS){const row=document.createElement('label');row.className='player-row';const c=document.createElement('input');c.type='checkbox';c.checked=draft.has(p.id);const detail=document.createElement('span'),name=document.createElement('span'),small=document.createElement('small');name.textContent=p.number+' '+p.name;small.textContent=p.position+' ・2026/27';detail.append(name,small);row.append(c,detail);$('roster').append(row);c.onchange=()=>{c.checked?draft.add(p.id):draft.delete(p.id);count()}}count();$('players').showModal()};
$('close').onclick=()=>$('players').close();
$('apply').onclick=()=>{if(draft.size!==11)return;const rank={GK:0,DF:1,MF:2,FW:3};state.lineup=ARSENAL_PLAYERS.filter(p=>draft.has(p.id)).sort((a,b)=>rank[a.position]-rank[b.position]).map(p=>p.id);selected=null;resetTeam('home');render();$('players').close();say('11人を適用しました。細かな位置はドラッグで調整してください。');save()};
function connection(){say(!navigator.onLine?'オフラインです。保存済みのボードを利用できます。':ready?'オフライン準備完了。配置は端末に自動保存されます。':'配置は端末に自動保存されます。')}
window.addEventListener('online',connection);window.addEventListener('offline',connection);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
if(!restore()){resetTeam('home');resetTeam('away')}updatePanel();updateOrientation();connection();
if('serviceWorker'in navigator&&isSecureContext){
 const controlled=!!navigator.serviceWorker.controller;let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled&&!reloading){reloading=true;save();window.location.reload()}});
 navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>{ready=true;connection()}).catch(()=>say('オフライン準備に失敗しました。オンラインでは利用できます。'));
}else say('オフライン機能はHTTPSまたはlocalhostで利用できます。');
</script>
</html>
